version: '3.8'
services:
  postgres:
    image: postgres:latest
    container_name: nestjs-postgres
    environment:
      POSTGRES_USER: user       # PostgreSQL 사용자 이름
      POSTGRES_PASSWORD: password     # PostgreSQL 비밀번호
      POSTGRES_DB: blog      # 생성할 데이터베이스 이름    
    restart: always
    ports:
      - '5434:5432'
    env_file:
      - .env
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres:
    name: nestjs-db
